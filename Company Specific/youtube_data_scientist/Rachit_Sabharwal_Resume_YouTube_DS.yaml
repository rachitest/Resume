cv:
  name: Rachit Sabharwal
  location: Cypress, Texas
  phone: tel:+1 585-281-1928
  email: rachit-sabharwal@outlook.com
  social_networks:
    - network: GitHub
      username: rachitest
  sections:
    Professional Summary:
      - Ph.D. Candidate (expected Aug 2026)
        with training in causal inference and quasi-experimental
        methods, plus 6+ years building predictive models and decision-support
        tools for business and research stakeholders across CPG, chemicals,
        biotech, and healthcare. Comfortable owning work end-to-end — from
        large-scale ETL and modeling through stakeholder-facing dashboards
        and executive white papers.

    Education:
      - institution: The University of Texas Health Science Center at Houston
        area: Epidemiology and Biostatistics
        degree: Ph.D.
        location: Houston, TX
        date: "Expected Aug 2026"
        highlights:
          - "Coursework: Causal Inference, Quasi-Experimental Methods, Survival
            Analysis, Longitudinal Data Analysis, Bayesian Statistics"
          - "Certificates: Advanced Data Science"
      - institution: The University of California, Berkeley
        area: Software Development and Programming
        degree: Cert.
        location: Berkeley, CA
        end_date: 2025-04
      - institution: The University of Texas Health Science Center at Houston
        area: Biostatistics
        degree: M.S.
        location: Houston, TX
        end_date: 2022-05
      - institution: University of Rochester
        area: Environmental Health
        degree: B.S.
        location: Rochester, NY
        end_date: 2018-05

    Experience:
      - company: UTHealth Houston, School of Public Health
        position: Research Data Scientist
        location: Houston, TX
        start_date: 2020-02
        end_date: present
        highlights:
          - Contributed quantitative analyses on claims data and EHR data to an
            R01 grant proposal on disability in adolescents and young adults.
          - Cut data-munging turnaround 24x by re-architecting the TexasCARES
            ETL to process multi-year, out-of-memory cohort data using
            polars and duckdb; stood up CI/CD automated reporting that ingests
            new data weekly, runs automated data-quality checks, and publishes
            stakeholder outputs without manual intervention.
          - Shipped and maintained a public-facing statewide COVID-19 dashboard
            (Python, Tableau) ingesting case and antibody survey data
            continuously, providing real-time epidemic monitoring for public
            and health-department stakeholders.
          - Designed multi-site star schema and ETL for DETECT-RPC harmonizing
            clinical records from 6 academic medical centers; built a Quarto
            dashboard giving PIs real-time visibility into data collection
            progress across sites.
          - Co-authored 4 peer-reviewed publications on SARS-CoV-2 vaccine
            non-response and pediatric COVID comorbidities using survival
            analysis and mixed models on population-based cohorts.

      - company: The Dow Chemical Company
        position: ML R&D Intern
        location: Lake Jackson, TX
        start_date: 2025-05
        end_date: 2025-08
        highlights:
          - Benchmarked Bayesian models (Gaussian process regression, Bayesian
            neural networks, Monte Carlo dropout) against frequentist
            counterparts across 25+ measurement-error scenarios using PICP,
            ECE, and CI-width calibration metrics.
          - Shipped an R Shiny decision-support app automating 50% of
            enterprise Life Cycle Assessment workflows, estimated at $15M in
            annual cost savings across Dow's global operations.
          - Authored an internal Bayesian UQ white paper distilling benchmark
            findings into organizational guidance for future predictive
            modeling projects.

      - company: Genentech
        position: Informatics Intern
        location: San Francisco, CA
        start_date: 2021-05
        end_date: 2022-01
        highlights:
          - Reproduced the published GLIT multimodal GNN on DILI benchmarks,
            then prototyped a lower-complexity MLP combining ECFP fingerprints
            with drug diffusion profiles, demonstrating comparable predictive
            performance at substantially reduced model complexity.
          - Built a document tokenization framework that feeds into downstream
            NLP annotation and text-mining pipelines.

      - company: Procter & Gamble
        position: Advanced Analytics Co-Op
        location: Cincinnati, OH
        start_date: 2021-01
        end_date: 2021-04
        highlights:
          - Delivered predictive and explanatory models on shopper and retailer
            behavior for global Fabric Care brand teams; translated findings
            into recommendations that informed corporate strategy around DTC
            ecommerce.
          - Raised cross-functional analyst throughput 1.5x by building GCP
            big-data ETL pipelines using Apache Airflow to process
            out-of-memory shopper and retailer datasets.
          - Raised codebase test coverage from 0% to 70% by introducing
            containerization, unit testing, and agile practices.

      - company: Bristol Myers Squibb
        position: Data Engineering Intern
        location: San Francisco, CA
        start_date: 2020-06
        end_date: 2020-08
        highlights:
          - Built PatRec, a full-stack patent recommendations app chaining
            chemical-entity NER, NCBI federated search, and TF-IDF
            cosine-similarity ranking to surface relevant patents from an
            80M-patent corpus for internal R&D scientists.
          - Designed relational (PostgreSQL) and graph (Neo4j) database
            architectures supporting multiple internal R&D analytical
            workloads.

    Selected Publications:
      - title: Trust and Uncertainty Quantification in Machine Learning
          Models Under Measurement Error
        authors:
          - '**Sabharwal R**'
        date: 2025-08
        journal: The Dow Chemical Company, Internal White Paper

      - title: Factors associated with elevated SARS-CoV-2 immune response
          in children and adolescents
        authors:
          - Messiah SE
          - Abbas R
          - Bergqvist E
          - Swartz MD
          - Talebi Y
          - '**Sabharwal R**'
          - et al.
        date: 2024-08
        doi: 10.3389/fped.2024.1393321
        journal: Frontiers in Pediatrics

      - title: Baseline characteristics of SARS-CoV-2 vaccine non-responders
          in a large population-based sample
        authors:
          - Yaseen A
          - DeSantis SM
          - '**Sabharwal R**'
          - et al.
        date: 2024-05
        doi: 10.1371/journal.pone.0303420
        journal: PLoS One

      - title: Long-term immune response to SARS-CoV-2 infection and
          vaccination in children and adolescents
        authors:
          - Messiah SE
          - Talebi Y
          - Swartz MD
          - '**Sabharwal R**'
          - et al.
        date: 2023-10
        doi: 10.1038/s41390-023-02857-y
        journal: Pediatric Research

    Skills:
      - label: "Causal Inference & Experimentation"
        details: "Difference-in-Differences, Synthetic Control, Propensity
          Scores / IPW, G-methods, Instrumental Variables, Target Trial
          Emulation, A/B Testing & Power Analysis"
      - label: "Statistical Methods"
        details: "Survival Analysis, Linear & Generalized Linear Mixed Models,
          Longitudinal Data Analysis, Bayesian Inference & UQ, Measurement
          Error Modeling"
      - label: "ML"
        details: "scikit-learn, PyTorch, tidymodels, brms, statsmodels,
          lifelines, Optuna, SHAP"
      - label: "Programming & Data"
        details: "Python (polars, pandas, duckdb), R (data.table, tidyverse),
          SQL, SAS, Bash"
      - label: "Production & Cloud"
        details: "Docker, Apache Airflow, GitHub/GitLab CI/CD, GCP (BigQuery),
          AWS, Azure, PostgreSQL"
      - label: "Visualization & Communication"
        details: "R Shiny, Quarto, Tableau, ggplot2, Plotly, Streamlit,
          peer-reviewed publications, white papers"

design:
  theme: harvard
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    font_family: XCharter
    line_spacing: 0.6em
    alignment: left
    date_and_location_column_alignment: right
    font_size:
      body: 10pt
      name: 25pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.3em
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    space_below_name: 0.5cm
    space_below_connections: 0.5cm
    connections:
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: •
      space_between_connections: 0.4cm
  section_titles:
    type: centered_with_centered_partial_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.2cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 3.5cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: true
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: '**DEGREE**'
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
locale:
  language: english
